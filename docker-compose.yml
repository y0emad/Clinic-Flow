services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ClinicFlow
      POSTGRES_PASSWORD: ClinicFlow
      POSTGRES_DB: ClinicFlow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ClinicFlow -d ClinicFlow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API itself. For local development you usually run only the db
  # (docker compose up -d db) and start the API with npm run dev.
  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database host is the "db" service, not localhost.
      DATABASE_URL: postgres://ClinicFlow:ClinicFlow@db:5432/ClinicFlow
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
