name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    # Same Postgres as docker-compose.yml. The tests create and migrate
    # the ClinicFlow_test database on it by themselves (tests/globalSetup.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ClinicFlow
          POSTGRES_PASSWORD: ClinicFlow
          POSTGRES_DB: ClinicFlow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ClinicFlow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  client:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

  docker:
    name: Docker build & publish
    runs-on: ubuntu-latest
    needs: [test, client]
    # On pull requests the image is only built (to check it builds).
    # On main it is also pushed to Docker Hub, and the server picks it up (deploy/update.sh).
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          # latest = what the server runs; the commit sha = a fixed version to roll back to
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'clinicflow' }}/clinicflow:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'clinicflow' }}/clinicflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
